[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[dependency-groups]
dev = [
  "deptry",
  "ruff>=0.17.3"
]

[project]
authors = [
  { name = "Niccolo Cantu", email = "niccolo.cantu@nina.no" }
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "django>=5.2",
  "django-distill>=4.0.6",
  "django-environ",
  "nanodjango>=0.17.1",
  "owslib>=0.35.0",
  "pygeometa>=0.19.0",
  "pyyaml>=6.0"
]
description = ""
license = "GPL-3.0+"
name = "datasets"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.scripts]
datasets = "main:start"

[tool.deptry]
known_first_party = ["main"]

[tool.deptry.per_rule_ignores]
DEP002 = ["django-distill"]

[tool.pixi.dependencies]
bun = ">=1.4,<2"
python = ">=3.15,<3.16"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
datasets = { path = ".", editable = true }

[tool.pixi.tasks]
build-css = { cmd = "bun run build:css", depends-on = ["install-web"] }
build-static = { cmd = "python main.py manage distill generate --output-directory output/ --collectstatic --force", depends-on = ["build-css"] }
check = { depends-on = ["lint", "format-check", "deptry", "build-css"] }
collect-static = { cmd = "python main.py manage collectstatic --noinput", depends-on = ["build-css"] }
deptry = "deptry ."
format-check = "ruff format --check ."
install-web = "bun install --frozen-lockfile"
lint = "ruff check ."
start = { cmd = "python main.py", depends-on = ["collect-static"] }
watch-css = { cmd = "bun run watch:css", depends-on = ["install-web"] }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.59.0"

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.setuptools]
packages = ["templates"]
py-modules = ["main"]

[tool.setuptools.package-data]
templates = ["*.html", "*.yml"]

[tool.uv]
package = true
