{% extends "base.html" %}

{% block content %}
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {% for identifier, record in records %}
      <article
        id="{{ identifier }}"
        class="card border border-base-300 bg-base-100 shadow-sm"
      >
        <div class="card-body">
          <h2 class="card-title text-primary">{{ record.title }}</h2>
          <p>{{ record.abstract }}</p>
        </div>
      </article>
    {% empty %}
      <p class="col-span-full rounded-box bg-base-100 p-6">No catalogue records found.</p>
    {% endfor %}
  </div>
{% endblock %}
