<article
  id="{{ dataset.identifier }}"
  class="card border border-base-300 bg-base-100 shadow-sm"
  data-dataset-card
>
  <div data-preview-frame class="relative h-24 max-h-24 w-full overflow-hidden">
    <div class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-secondary/10 via-base-200 to-accent/15" aria-hidden="true">
      <span class="rounded-full bg-base-100/70 p-2.5 text-secondary shadow-sm">
        <svg
          class="h-8 w-8"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="7" y="9" width="34" height="30" rx="9" fill="currentColor" opacity=".08" />
          <circle cx="31" cy="19" r="4" fill="#cc8614" stroke="none" />
          <path d="m11 34 9-11 7 8 5-6 5 6v3H11Z" fill="currentColor" opacity=".25" />
          <path d="m11 34 9-11 7 8 5-6 5 6M11 34h26" />
        </svg>
      </span>
    </div>
    {% if dataset.preview %}
      <img
        class="absolute inset-0 h-full max-h-24 w-full object-cover"
        src="{{ dataset.preview }}"
        alt="Preview of {{ dataset.title }}"
        loading="lazy"
        decoding="async"
        data-dataset-preview
      >
    {% endif %}
  </div>
  <div class="card-body">
    <h2 class="card-title text-primary">
      <a href="/datasets/{{ dataset.slug }}/" data-dataset-title>{{ dataset.title }}</a>
    </h2>
    <div
      class="flex flex-wrap gap-2"
      aria-label="Dataset tags"
      data-dataset-tags
      {% if not dataset.keyword_tags %}hidden{% endif %}
    >
      {% for tag in dataset.keyword_tags %}
        <a
          class="badge badge-secondary badge-outline"
          href="/search/?submitted=1&amp;keyword={{ tag|urlencode }}"
        >{{ tag }}</a>
      {% endfor %}
    </div>
  </div>
</article>
