[dependency-groups]
dev = [
  "deptry",
  "ruff>=0.17.3"
]

[project]
authors = [
  { name = "Niccolo Cantu", email = "niccolo.cantu@nina.no" }
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "django-environ"
]
description = ""
license = "GPL-3.0+"
name = "datasets"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.scripts]
datasets = "main:start"

[tool.deptry]
known_first_party = ["main"]

[tool.pixi.dependencies]
bun = ">=1.4,<2"
python = ">=3.15,<3.16"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
datasets = { path = ".", editable = true }

[tool.pixi.tasks]
check = { depends-on = ["lint", "format-check", "deptry"] }
deptry = "deptry ."
format-check = "ruff format --check ."
lint = "ruff check ."
start = "python main.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.59.0"

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.uv]
package = true
